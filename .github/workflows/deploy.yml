name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to KZ server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.KZ_HOST }}
          username: ${{ secrets.KZ_USER }}
          key: ${{ secrets.KZ_SSH_KEY }}
          script: |
            set -e

            cd /opt/olnoo/projects/ranvio

            git fetch origin
            git reset --hard origin/main

            pnpm install --frozen-lockfile
            pnpm build

            systemctl restart ranvio.service
